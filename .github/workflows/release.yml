name: Release

# Publishes the root package to npm and creates the matching GitHub release
# when a version tag is pushed. npm authentication is trusted publishing (OIDC),
# so no token is stored here. The very first publish of a package cannot use
# OIDC: npm only lets a trusted publisher be configured for a package that
# already exists, so release 1 is published by hand. A version that is already
# on npm is not published again, so pushing its tag afterwards only creates the
# GitHub release. Running the workflow by hand on a branch releases the version
# in package.json, but only when its tag already exists; that is how a tag whose
# own run failed is released once the workflow is fixed.
# See "Publishing a release" in CONTRIBUTING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # contents: write creates the GitHub release; id-token: write is the OIDC
  # token npm exchanges for a short-lived publish credential.
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; the runner ships an older one.
      - name: Update npm
        run: npm install --global npm@^11.5.1
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-4.11.0.cjs install --immutable
      - name: Typecheck
        run: node .yarn/releases/yarn-4.11.0.cjs typecheck
      - name: Lint
        run: node .yarn/releases/yarn-4.11.0.cjs lint
      - name: Test
        run: node .yarn/releases/yarn-4.11.0.cjs test
      - name: Test performance tooling
        run: node .yarn/releases/yarn-4.11.0.cjs test:perf-tools
      # check:package inspects the built lib/ output, so the build comes first.
      - name: Build distribution
        run: node .yarn/releases/yarn-4.11.0.cjs build
      - name: Verify packed exports and consumer types
        run: node .yarn/releases/yarn-4.11.0.cjs check:package
      # A tag that disagrees with package.json would publish the wrong version.
      - name: Resolve the version and dist-tag
        id: release
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "${{ github.ref_name }}" != "v$version" ]; then
              echo "Tag ${{ github.ref_name }} does not match package.json version $version" >&2
              exit 1
            fi
          elif ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "A manual run releases only a version that is already tagged; v$version is not" >&2
            exit 1
          fi
          name=$(node -p "require('./package.json').name")
          # Ask the registry directly: setup-node writes a placeholder auth token
          # that can make an authenticated npm view fail for a public package.
          if curl --silent --fail --output /dev/null "https://registry.npmjs.org/$name/$version"; then
            published=true
          else
            published=false
          fi
          # A prerelease only steps aside once a stable version exists. Until
          # then it is the newest thing to install, so npm `latest` and the
          # GitHub "Latest" release both follow it; afterwards prereleases go
          # to `next` and are marked as GitHub prereleases.
          stable=$(curl --silent --fail "https://registry.npmjs.org/$name" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{let v=[];try{v=Object.keys(JSON.parse(d).versions||{})}catch{}console.log(v.some(x=>!x.includes("-")))})' \
            || echo false)
          case "$version" in
            *-*)
              if [ "$stable" = "true" ]; then tag=next; prerelease=true; else tag=latest; prerelease=false; fi ;;
            *) tag=latest; prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=v$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "$name@$version: dist-tag $tag, GitHub prerelease $prerelease, stable exists $stable, already on npm $published"
      # prepack runs the Bob build. Provenance is attached automatically by
      # trusted publishing, so --provenance is not passed here.
      - name: Publish
        if: steps.release.outputs.published == 'false'
        run: npm publish --tag "${{ steps.release.outputs.tag }}"
      # Marked as a prerelease only when a stable version exists, so the
      # repository page shows the same "Latest" as npm.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release.outputs.release }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.release.outputs.release }} already exists"
            exit 0
          fi
          if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then
            flag="--prerelease"
          else
            flag="--latest"
          fi
          gh release create "${{ steps.release.outputs.release }}" \
            --verify-tag \
            --title "${{ steps.release.outputs.release }}" \
            --generate-notes \
            "$flag"

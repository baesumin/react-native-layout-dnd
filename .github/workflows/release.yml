name: Release

# Publishes the root package to npm when a version tag is pushed.
# Authentication is npm trusted publishing (OIDC), so no token is stored here.
# The very first publish of a package cannot use OIDC: npm only lets a trusted
# publisher be configured for a package that already exists, so release 1 is
# published by hand. See "Publishing a release" in CONTRIBUTING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; the runner ships an older one.
      - name: Update npm
        run: npm install --global npm@^11.5.1
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-4.11.0.cjs install --immutable
      - name: Typecheck
        run: node .yarn/releases/yarn-4.11.0.cjs typecheck
      - name: Lint
        run: node .yarn/releases/yarn-4.11.0.cjs lint
      - name: Test
        run: node .yarn/releases/yarn-4.11.0.cjs test
      - name: Test performance tooling
        run: node .yarn/releases/yarn-4.11.0.cjs test:perf-tools
      - name: Verify packed exports and consumer types
        run: node .yarn/releases/yarn-4.11.0.cjs check:package
      # A tag that disagrees with package.json would publish the wrong version.
      - name: Resolve the version and dist-tag
        id: release
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version $version" >&2
            exit 1
          fi
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version under the $tag dist-tag"
      # prepack runs the Bob build. Provenance is attached automatically by
      # trusted publishing, so --provenance is not passed here.
      - name: Publish
        run: npm publish --tag "${{ steps.release.outputs.tag }}"
